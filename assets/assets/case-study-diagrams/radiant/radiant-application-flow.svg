<text x="755" y="570" text-anchor="middle" class="nodeTitle">Supervisor review</text><text x="755" y="594" text-anchor="middle" class="nodeText">Check quantity and condition</text><text x="755" y="615" text-anchor="middle" class="nodeText">Confirm received goods</text>
<text x="1005" y="585" text-anchor="middle" class="nodeTitle">Condition</text><text x="1005" y="605" text-anchor="middle" class="nodeTitle">acceptable?</text>
<text x="1255" y="570" text-anchor="middle" class="nodeTitle">Assign storage</text><text x="1255" y="594" text-anchor="middle" class="nodeText">Choose warehouse / location</text><text x="1255" y="615" text-anchor="middle" class="nodeText">Update stock record</text>
<text x="1570" y="570" text-anchor="middle" class="nodeTitle">Stock available</text><text x="1570" y="594" text-anchor="middle" class="nodeText">Item becomes visible</text><text x="1570" y="615" text-anchor="middle" class="nodeText">for inventory monitoring</text>
<text x="1890" y="570" text-anchor="middle" class="nodeTitle">Warehouse Manager</text><text x="1890" y="594" text-anchor="middle" class="nodeText">Monitor incoming and</text><text x="1890" y="615" text-anchor="middle" class="nodeText">available stock</text>
