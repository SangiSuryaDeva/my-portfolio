<text x="350" y="1326" class="stickyTitle">Design decision · Role separation</text><text x="350" y="1348" class="stickyText">Receptionist captures; Supervisor verifies.</text><text x="350" y="1368" class="stickyText">Distinct responsibilities reduce ambiguity.</text>
<text x="720" y="1326" class="stickyTitle">Exception path</text><text x="720" y="1348" class="stickyText">Damaged goods are separated for return</text><text x="720" y="1368" class="stickyText">rather than stored as available stock.</text>
<text x="1090" y="1326" class="stickyTitle">Feedback-driven refinement</text><text x="1090" y="1348" class="stickyText">Tablet actions repositioned for reach;</text><text x="1090" y="1368" class="stickyText">selected wide tables became cards.</text>
<text x="1460" y="1326" class="stickyTitle">Scope note</text><text x="1460" y="1348" class="stickyText">Functional UX flow based on known product context.</text><text x="1460" y="1368" class="stickyText">Not a technical integration or API architecture.</text>

