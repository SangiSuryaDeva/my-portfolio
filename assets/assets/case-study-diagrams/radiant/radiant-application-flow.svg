<text x="885" y="1100" text-anchor="middle" class="nodeTitle">View warehouse status</text><text x="885" y="1124" text-anchor="middle" class="nodeText">Understand availability across</text><text x="885" y="1145" text-anchor="middle" class="nodeText">managed warehouse operations</text>
