<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#536170"/></marker>
  <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C58A1B"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#233044" flood-opacity=".12"/></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#D8DDE3"/></pattern>
  <style>
    .title{font:700 42px Inter,Arial,sans-serif;fill:#202A35}
    .subtitle{font:400 19px Inter,Arial,sans-serif;fill:#697586}
    .laneTitle{font:700 20px Inter,Arial,sans-serif;fill:#243142}
    .nodeTitle{font:700 17px Inter,Arial,sans-serif;fill:#243142}
    .nodeText{font:400 14px Inter,Arial,sans-serif;fill:#445164}
    .small{font:600 13px Inter,Arial,sans-serif;fill:#596678}
    .stickyTitle{font:700 15px Inter,Arial,sans-serif;fill:#433B2B}
    .stickyText{font:400 13px Inter,Arial,sans-serif;fill:#514A3C}
    .line{fill:none;stroke:#536170;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .goldLine{fill:none;stroke:#C58A1B;stroke-width:3.5;marker-end:url(#arrowGold);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<!-- board -->
<rect width="2200" height="1500" fill="#F8F9FB"/>
<rect width="2200" height="1500" fill="url(#dots)" opacity=".65"/>
<!-- header -->
<rect x="52" y="40" width="2096" height="130" rx="24" fill="#FFFFFF" stroke="#E3E7ED" filter="url(#shadow)"/>
<circle cx="105" cy="91" r="23" fill="#F4C66A"/><circle cx="105" cy="91" r="12" fill="#D89520"/>
