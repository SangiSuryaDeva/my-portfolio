<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1380" viewBox="0 0 2200 1380">
<defs>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#D7DDE5"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3778D4"/></marker>
  <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#29966A"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity=".10"/></filter>
  <style>
    .h1{font:700 39px Inter,Arial,sans-serif;fill:#202938}
    .sub{font:400 18px Inter,Arial,sans-serif;fill:#687487}
    .lane{font:700 21px Inter,Arial,sans-serif;fill:#233044}
    .title{font:700 17px Inter,Arial,sans-serif;fill:#263347}
    .body{font:400 14px Inter,Arial,sans-serif;fill:#536176}
    .notehead{font:700 15px Inter,Arial,sans-serif;fill:#4B4436}
    .notetext{font:400 13px Inter,Arial,sans-serif;fill:#5A5243}
    .label{font:700 12px Inter,Arial,sans-serif;letter-spacing:.4px;fill:#667085}
    .conn{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .cust{fill:none;stroke:#3778D4;stroke-width:3.5;marker-end:url(#blueArrow);stroke-linecap:round;stroke-linejoin:round}
    .prov{fill:none;stroke:#29966A;stroke-width:3.5;marker-end:url(#greenArrow);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="2200" height="1380" fill="#F8FAFC"/><rect width="2200" height="1380" fill="url(#dots)" opacity=".8"/>
<!-- Header -->
<rect x="48" y="38" width="2104" height="126" rx="22" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<circle cx="101" cy="85" r="23" fill="#DCEBFF"/><path d="M91 85h20M101 75v20" stroke="#3778D4" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="88" class="h1">KAPSTON SERVICES · Application Flow</text>
<text x="147" y="121" class="sub">Customer booking journey and service-provider journey</text>
<rect x="1772" y="70" width="326" height="42" rx="21" fill="#EEF4FF" stroke="#C9DAF8"/>
<text x="1935" y="96" text-anchor="middle" class="label" fill="#2D65B1">CUSTOMER APP + PROVIDER APP</text>

<!-- lane backgrounds -->
<rect x="48" y="196" width="2104" height="445" rx="22" fill="#EEF5FF" stroke="#D2E2FA"/>
<rect x="48" y="665" width="2104" height="445" rx="22" fill="#ECF8F1" stroke="#CDEAD8"/>
<rect x="48" y="1134" width="2104" height="190" rx="22" fill="#FFF6E3" stroke="#F0DDAA"/>

<!-- lane headers -->
<rect x="72" y="218" width="248" height="48" rx="13" fill="#D9E9FF"/><text x="196" y="249" text-anchor="middle" class="lane">1 · Customer App</text>
<rect x="72" y="687" width="248" height="48" rx="13" fill="#D4F0DF"/><text x="196" y="718" text-anchor="middle" class="lane">2 · Service Provider App</text>
<rect x="72" y="1157" width="248" height="44" rx="12" fill="#FFE9B9"/><text x="196" y="1186" text-anchor="middle" class="lane">3 · Shared Outcome</text>

<!-- customer flow nodes -->
<g filter="url(#shadow)">
 <rect x="360" y="310" width="190" height="100" rx="16" fill="#FFFFFF" stroke="#83B2F0" stroke-width="2"/>
 <rect x="605" y="310" width="205" height="100" rx="16" fill="#FFFFFF" stroke="#83B2F0" stroke-width="2"/>
 <rect x="865" y="310" width="210" height="100" rx="16" fill="#FFFFFF" stroke="#83B2F0" stroke-width="2"/>
 <rect x="1130" y="310" width="210" height="100" rx="16" fill="#FFFFFF" stroke="#83B2F0" stroke-width="2"/>
 <rect x="1395" y="310" width="205" height="100" rx="16" fill="#FFFFFF" stroke="#83B2F0" stroke-width="2"/>
 <rect x="1655" y="310" width="230" height="100" rx="16" fill="#DCEBFF" stroke="#83B2F0" stroke-width="2"/>
 <polygon points="1995,300 2070,360 1995,420 1920,360" fill="#FFF8E7" stroke="#D6A33A" stroke-width="2"/>
</g>
<text x="455" y="346" text-anchor="middle" class="title">Open app</text><text x="455" y="371" text-anchor="middle" class="body">Customer starts</text><text x="455" y="390" text-anchor="middle" class="body">a service request</text>
<text x="707" y="346" text-anchor="middle" class="title">Choose category</text><text x="707" y="371" text-anchor="middle" class="body">Driver, watchman,</text><text x="707" y="390" text-anchor="middle" class="body">security or other service</text>
<text x="970" y="346" text-anchor="middle" class="title">Explore options</text><text x="970" y="371" text-anchor="middle" class="body">Review relevant service</text><text x="970" y="390" text-anchor="middle" class="body">and available choices</text>
<text x="1235" y="346" text-anchor="middle" class="title">Select service</text><text x="1235" y="371" text-anchor="middle" class="body">Choose the required</text><text x="1235" y="390" text-anchor="middle" class="body">service option</text>
<text x="1497" y="346" text-anchor="middle" class="title">Enter booking details</text><text x="1497" y="371" text-anchor="middle" class="body">Provide details needed</text><text x="1497" y="390" text-anchor="middle" class="body">to request the service</text>
<text x="1770" y="346" text-anchor="middle" class="title">Submit request</text><text x="1770" y="371" text-anchor="middle" class="body">Review and confirm</text><text x="1770" y="390" text-anchor="middle" class="body">the booking request</text>
<text x="1995" y="354" text-anchor="middle" class="title">Booking</text><text x="1995" y="374" text-anchor="middle" class="title">confirmed?</text>
<path d="M550 360H605 M810 360H865 M1075 360H1130 M1340 360H1395 M1600 360H1655 M1885 360H1920" class="cust"/>

<!-- customer return / adjustment -->
<rect x="1690" y="470" width="310" height="76" rx="13" fill="#FFF0C8" stroke="#E4C66C" filter="url(#shadow)"/>
<text x="1845" y="499" text-anchor="middle" class="title">Review / adjust request</text><text x="1845" y="522" text-anchor="middle" class="body">Update details before retrying</text>
<path d="M1995 420V444H1845V470" fill="none" stroke="#D6A33A" stroke-width="3" stroke-linecap="round"/>
<text x="2010" y="442" class="label" fill="#946A0B">NO / RETRY</text>
<path d="M1690 508H1510V432H1497V410" fill="none" stroke="#D6A33A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="1930" y="466" width="170" height="74" rx="13" fill="#D9F3E3" stroke="#8AD1A8"/>
<text x="2015" y="495" text-anchor="middle" class="title">Request</text><text x="2015" y="516" text-anchor="middle" class="title">submitted</text>
<path d="M1995 420V444H2015V466" class="prov"/>
<text x="2010" y="459" class="label" fill="#23845A">YES</text>

<!-- provider flow nodes -->
<g filter="url(#shadow)">
 <rect x="360" y="779" width="210" height="100" rx="16" fill="#FFFFFF" stroke="#7BC69A" stroke-width="2"/>
 <rect x="625" y="779" width="215" height="100" rx="16" fill="#FFFFFF" stroke="#7BC69A" stroke-width="2"/>
 <rect x="895" y="779" width="220" height="100" rx="16" fill="#FFFFFF" stroke="#7BC69A" stroke-width="2"/>
 <polygon points="1230,770 1305,829 1230,888 1155,829" fill="#F8FFF9" stroke="#D6A33A" stroke-width="2"/>
 <rect x="1355" y="779" width="220" height="100" rx="16" fill="#FFFFFF" stroke="#7BC69A" stroke-width="2"/>
 <rect x="1625" y="779" width="225" height="100" rx="16" fill="#FFFFFF" stroke="#7BC69A" stroke-width="2"/>
 <rect x="1890" y="779" width="210" height="100" rx="16" fill="#D6F2E0" stroke="#7BC69A" stroke-width="2"/>
</g>
<text x="465" y="815" text-anchor="middle" class="title">Open provider app</text><text x="465" y="840" text-anchor="middle" class="body">Service provider</text><text x="465" y="859" text-anchor="middle" class="body">accesses their app</text>
<text x="732" y="815" text-anchor="middle" class="title">View work area</text><text x="732" y="840" text-anchor="middle" class="body">Review available</text><text x="732" y="859" text-anchor="middle" class="body">service-related information</text>
<text x="1005" y="815" text-anchor="middle" class="title">Review request</text><text x="1005" y="840" text-anchor="middle" class="body">Check the request</text><text x="1005" y="859" text-anchor="middle" class="body">details provided</text>
<text x="1230" y="824" text-anchor="middle" class="title">Can fulfil</text><text x="1230" y="845" text-anchor="middle" class="title">request?</text>
<text x="1465" y="815" text-anchor="middle" class="title">Respond to request</text><text x="1465" y="840" text-anchor="middle" class="body">Continue according to</text><text x="1465" y="859" text-anchor="middle" class="body">the app's workflow</text>
<text x="1737" y="815" text-anchor="middle" class="title">Service coordination</text><text x="1737" y="840" text-anchor="middle" class="body">Customer and provider</text><text x="1737" y="859" text-anchor="middle" class="body">are aligned on the request</text>
<text x="1995" y="815" text-anchor="middle" class="title">Service journey</text><text x="1995" y="840" text-anchor="middle" class="body">continues</text><text x="1995" y="859" text-anchor="middle" class="body">through provider app</text>
<path d="M570 829H625 M840 829H895 M1115 829H1155 M1305 829H1355 M1575 829H1625 M1850 829H1890" class="prov"/>
<text x="1320" y="808" class="label" fill="#23845A">YES</text>
<!-- unable path -->
<rect x="990" y="924" width="365" height="75" rx="13" fill="#FFF0C8" stroke="#E4C66C" filter="url(#shadow)"/>
<text x="1172" y="953" text-anchor="middle" class="title">Request needs another option</text><text x="1172" y="976" text-anchor="middle" class="body">Return to request review / selection</text>
<path d="M1230 888V906H1172V924" fill="none" stroke="#D6A33A" stroke-width="3"/>
<text x="1245" y="907" class="label" fill="#946A0B">NO</text>
<path d="M990 962H925V895H1005V879" fill="none" stroke="#D6A33A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

<!-- Shared outcome -->
<g filter="url(#shadow)">
 <rect x="365" y="1210" width="390" height="76" rx="15" fill="#FFFFFF" stroke="#E1BD59" stroke-width="2"/>
 <rect x="835" y="1210" width="390" height="76" rx="15" fill="#FFFFFF" stroke="#E1BD59" stroke-width="2"/>
 <rect x="1305" y="1210" width="390" height="76" rx="15" fill="#FFFFFF" stroke="#E1BD59" stroke-width="2"/>
 <rect x="1775" y="1210" width="325" height="76" rx="15" fill="#FFE9B9" stroke="#E1BD59" stroke-width="2"/>
</g>
<text x="560" y="1240" text-anchor="middle" class="title">Customer need captured</text><text x="560" y="1263" text-anchor="middle" class="body">A service category and request are selected</text>
<text x="1030" y="1240" text-anchor="middle" class="title">Separate app experiences</text><text x="1030" y="1263" text-anchor="middle" class="body">Customer and provider have distinct journeys</text>
<text x="1500" y="1240" text-anchor="middle" class="title">Request details carried forward</text><text x="1500" y="1263" text-anchor="middle" class="body">The next steps follow the service workflow</text>
<text x="1937" y="1240" text-anchor="middle" class="title">Product purpose</text><text x="1937" y="1263" text-anchor="middle" class="body">Connect people to services</text>
<path d="M2015 540V600H560V1210" fill="none" stroke="#3778D4" stroke-width="2.5" stroke-dasharray="7 7"/>
<path d="M1995 879V1080H1030V1210" fill="none" stroke="#29966A" stroke-width="2.5" stroke-dasharray="7 7"/>
<path d="M755 1248H835 M1225 1248H1305 M1695 1248H1775" class="conn"/>

<!-- notes -->
<rect x="70" y="580" width="460" height="42" rx="10" fill="#FFFFFF" stroke="#C9D7EA"/>
<text x="90" y="606" class="body">Customer app: browse and request the service needed.</text>
<rect x="70" y="1040" width="600" height="42" rx="10" fill="#FFFFFF" stroke="#C7E4D1"/>
<text x="90" y="1066" class="body">Provider app: a separate experience for service-side tasks.</text>
<text x="48" y="1357" class="sub">KAPSTON SERVICES · Portfolio reconstruction from available project context</text>
</svg>