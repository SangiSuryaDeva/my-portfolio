<rect x="48" y="34" width="2304" height="122" rx="22" fill="#FFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<circle cx="102" cy="82" r="23" fill="#DDF3EF"/><path d="M91 82h22M102 71v22" stroke="#249B91" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="83" class="h1">ONPOINT HEALTH CARE · Application Flow</text>
<text x="147" y="118" class="sub">EHR workflow demonstrations + OnPoint Iris AI concept · clinician remains in control</text>
