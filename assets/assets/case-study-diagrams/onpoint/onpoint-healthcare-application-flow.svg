<text x="670" y="1400" text-anchor="middle" class="head">Human decision-making</text><text x="670" y="1424" text-anchor="middle" class="body">AI supports; clinician decides</text>
<text x="1120" y="1400" text-anchor="middle" class="head">Editable AI suggestions</text><text x="1120" y="1424" text-anchor="middle" class="body">Accept, modify, or remove drafts</text>
<text x="1570" y="1400" text-anchor="middle" class="head">Familiar EHR workflows</text><text x="1570" y="1424" text-anchor="middle" class="body">AI assistance sits alongside existing work</text>
<text x="2067" y="1400" text-anchor="middle" class="head">Design principle</text><text x="2067" y="1424" text-anchor="middle" class="body">Reduce review effort without replacing clinical judgment</text>
