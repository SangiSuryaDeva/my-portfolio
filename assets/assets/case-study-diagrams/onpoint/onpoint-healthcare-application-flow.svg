 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748B"/></marker>
 <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#477DD1"/></marker>
 <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#249B91"/></marker>
 <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#D18B24"/></marker>
 <style>
 .h1{font:700 38px Inter,Arial,sans-serif;fill:#1F2937}.sub{font:400 18px Inter,Arial,sans-serif;fill:#64748B}
 .lane{font:700 21px Inter,Arial,sans-serif;fill:#263449}.head{font:700 16px Inter,Arial,sans-serif;fill:#263449}
 .body{font:400 13px Inter,Arial,sans-serif;fill:#536176}.tiny{font:600 12px Inter,Arial,sans-serif;fill:#64748B}
 .notehead{font:700 15px Inter,Arial,sans-serif;fill:#5A4A2D}.notetext{font:400 13px Inter,Arial,sans-serif;fill:#5C5140}
 .line{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arr);stroke-linecap:round;stroke-linejoin:round}
 .patient{fill:none;stroke:#477DD1;stroke-width:3;marker-end:url(#blue);stroke-linecap:round;stroke-linejoin:round}
 .ai{fill:none;stroke:#249B91;stroke-width:3;marker-end:url(#teal);stroke-linecap:round;stroke-linejoin:round}
 .alt{fill:none;stroke:#D18B24;stroke-width:2.5;marker-end:url(#orange);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 6}
 </style>
</defs>
