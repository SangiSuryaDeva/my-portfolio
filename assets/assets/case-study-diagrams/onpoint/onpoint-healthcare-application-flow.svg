<text x="595" y="659" text-anchor="middle" class="head">Start consultation</text><text x="595" y="682" text-anchor="middle" class="body">Clinician meets patient</text><text x="595" y="700" text-anchor="middle" class="body">and conducts visit</text>
<text x="920" y="659" text-anchor="middle" class="head">Iris listens to conversation</text><text x="920" y="682" text-anchor="middle" class="body">Concept uses visit dialogue</text><text x="920" y="700" text-anchor="middle" class="body">to assist documentation</text>
<text x="1267" y="659" text-anchor="middle" class="head">Draft visit entries</text><text x="1267" y="682" text-anchor="middle" class="body">Suggest medications and tests</text><text x="1267" y="700" text-anchor="middle" class="body">for EHR entry</text>
<text x="1620" y="659" text-anchor="middle" class="head">Clinician reviews draft</text><text x="1620" y="682" text-anchor="middle" class="body">Inspect each proposed entry</text><text x="1620" y="700" text-anchor="middle" class="body">before it is applied</text>
<text x="1905" y="667" text-anchor="middle" class="head">Approve</text><text x="1905" y="686" text-anchor="middle" class="head">as is?</text>
<text x="2175" y="659" text-anchor="middle" class="head">Update EHR</text><text x="2175" y="682" text-anchor="middle" class="body">Accepted entries</text><text x="2175" y="700" text-anchor="middle" class="body">are applied</text>
