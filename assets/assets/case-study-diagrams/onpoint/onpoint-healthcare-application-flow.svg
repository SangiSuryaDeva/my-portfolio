<text x="930" y="1029" text-anchor="middle" class="head">Compare lab results</text><text x="930" y="1052" text-anchor="middle" class="body">Compare current results</text><text x="930" y="1070" text-anchor="middle" class="body">with previous results</text>
<text x="1277" y="1029" text-anchor="middle" class="head">Summarize findings</text><text x="1277" y="1052" text-anchor="middle" class="body">Highlight normal / urgent</text><text x="1277" y="1070" text-anchor="middle" class="body">items and considerations</text>
<text x="1632" y="1029" text-anchor="middle" class="head">Present review cues</text><text x="1632" y="1052" text-anchor="middle" class="body">Medication considerations</text><text x="1632" y="1070" text-anchor="middle" class="body">for clinician attention</text>
