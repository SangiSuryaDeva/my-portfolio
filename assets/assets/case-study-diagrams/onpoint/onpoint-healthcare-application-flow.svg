<text x="595" y="319" text-anchor="middle" class="head">Open patient record</text><text x="595" y="342" text-anchor="middle" class="body">Clinician enters familiar EHR</text><text x="595" y="360" text-anchor="middle" class="body">workflow</text>
<text x="915" y="319" text-anchor="middle" class="head">Gather available history</text><text x="915" y="342" text-anchor="middle" class="body">Relevant issues, medications,</text><text x="915" y="360" text-anchor="middle" class="body">labs and prior information</text>
<text x="1250" y="319" text-anchor="middle" class="head">Organize information</text><text x="1250" y="342" text-anchor="middle" class="body">Group details by health issue;</text><text x="1250" y="360" text-anchor="middle" class="body">surface missing / missed items</text>
<text x="1595" y="319" text-anchor="middle" class="head">Generate Iris AI summary</text><text x="1595" y="342" text-anchor="middle" class="body">Concise patient-history view</text><text x="1595" y="360" text-anchor="middle" class="body">for clinician preparation</text>
<text x="1940" y="319" text-anchor="middle" class="head">Review summary</text><text x="1940" y="342" text-anchor="middle" class="body">Clinician checks context</text><text x="1940" y="360" text-anchor="middle" class="body">before the appointment</text>
<text x="2225" y="319" text-anchor="middle" class="head">Visit ready</text><text x="2225" y="342" text-anchor="middle" class="body">Prepared</text><text x="2225" y="360" text-anchor="middle" class="body">discussion</text>
