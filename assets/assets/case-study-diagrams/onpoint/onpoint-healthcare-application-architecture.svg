 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748B"/></marker>
 <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#477DD1"/></marker>
 <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#249B91"/></marker>
 <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#D18B24"/></marker>
 <style>
 .h1{font:700 38px Inter,Arial,sans-serif;fill:#1F2937}.sub{font:400 18px Inter,Arial,sans-serif;fill:#64748B}.lane{font:700 21px Inter,Arial,sans-serif;fill:#263449}
 .head{font:700 16px Inter,Arial,sans-serif;fill:#263449}.body{font:400 13px Inter,Arial,sans-serif;fill:#536176}.tiny{font:600 12px Inter,Arial,sans-serif;fill:#64748B}
 .notehead{font:700 15px Inter,Arial,sans-serif;fill:#5A4A2D}.notetext{font:400 13px Inter,Arial,sans-serif;fill:#5C5140}
 .line{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arr);stroke-linecap:round;stroke-linejoin:round}
 .patient{fill:none;stroke:#477DD1;stroke-width:3;marker-end:url(#blue);stroke-linecap:round;stroke-linejoin:round}
 .ai{fill:none;stroke:#249B91;stroke-width:3;marker-end:url(#teal);stroke-linecap:round;stroke-linejoin:round}
 .alt{fill:none;stroke:#D18B24;stroke-width:2.5;marker-end:url(#orange);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 6}
 </style>
</defs>
<rect width="2400" height="1580" fill="#F8FAFC"/><rect width="2400" height="1580" fill="url(#dots)" opacity=".8"/>
<rect x="48" y="34" width="2304" height="122" rx="22" fill="#FFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<circle cx="102" cy="82" r="23" fill="#DDF3EF"/><path d="M91 82h22M102 71v22" stroke="#249B91" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="83" class="h1">ONPOINT HEALTH CARE · Application Architecture</text>
<text x="147" y="118" class="sub">Functional architecture across EHR touchpoints, Iris AI assistance, and clinician review</text>
<rect x="1885" y="67" width="410" height="42" rx="21" fill="#E5F6F2" stroke="#B4E5DC"/><text x="2090" y="94" text-anchor="middle" class="tiny" fill="#16786F">FUNCTIONAL / INFORMATION ARCHITECTURE</text>

<!-- top product surfaces -->
<rect x="48" y="180" width="2304" height="225" rx="22" fill="#EEF5FF" stroke="#D3E2FA"/>
<rect x="72" y="201" width="340" height="45" rx="12" fill="#DCEBFF"/><text x="242" y="230" text-anchor="middle" class="lane">1 · Product Surfaces</text>
<g filter="url(#shadow)">
<rect x="450" y="265" width="420" height="100" rx="16" fill="#FFF" stroke="#80A9E5" stroke-width="2"/>
<rect x="990" y="265" width="420" height="100" rx="16" fill="#FFF" stroke="#80A9E5" stroke-width="2"/>
<rect x="1530" y="265" width="420" height="100" rx="16" fill="#DCEBFF" stroke="#80A9E5" stroke-width="2"/>
<rect x="2070" y="265" width="240" height="100" rx="16" fill="#D4F0EA" stroke="#74C6BA" stroke-width="2"/>
</g>
<text x="660" y="300" text-anchor="middle" class="head">EHR Interface Demonstrations</text><text x="660" y="324" text-anchor="middle" class="body">Familiar patient / encounter workflow</text><text x="660" y="344" text-anchor="middle" class="tiny">EHR-style UI concept work</text>
<text x="1200" y="300" text-anchor="middle" class="head">OnPoint Iris AI Concept</text><text x="1200" y="324" text-anchor="middle" class="body">Patient context, summaries, visit assistance</text><text x="1200" y="344" text-anchor="middle" class="tiny">AI-assisted workflow concept</text>
<text x="1740" y="300" text-anchor="middle" class="head">Clinician Review Surface</text><text x="1740" y="324" text-anchor="middle" class="body">Review, edit, approve, remove suggestions</text><text x="1740" y="344" text-anchor="middle" class="tiny">Clinician remains decision-maker</text>
<text x="2190" y="300" text-anchor="middle" class="head">Output</text><text x="2190" y="324" text-anchor="middle" class="body">Reviewed</text><text x="2190" y="344" text-anchor="middle" class="body">information</text>
<path d="M870 315H990" class="patient"/><path d="M1410 315H1530" class="ai"/><path d="M1950 315H2070" class="line"/>

<!-- data organization -->
<rect x="48" y="430" width="2304" height="330" rx="22" fill="#EAF8F5" stroke="#C5E9E2"/>
<rect x="72" y="451" width="390" height="45" rx="12" fill="#D4F0EA"/><text x="267" y="480" text-anchor="middle" class="lane">2 · Patient Context &amp; Organization</text>
<g filter="url(#shadow)">
<rect x="450" y="525" width="330" height="92" rx="15" fill="#FFF" stroke="#74C6BA" stroke-width="2"/>
<rect x="850" y="525" width="330" height="92" rx="15" fill="#FFF" stroke="#74C6BA" stroke-width="2"/>
<rect x="1250" y="525" width="330" height="92" rx="15" fill="#FFF" stroke="#74C6BA" stroke-width="2"/>
<rect x="1650" y="525" width="330" height="92" rx="15" fill="#FFF" stroke="#74C6BA" stroke-width="2"/>
<rect x="2050" y="525" width="260" height="92" rx="15" fill="#D4F0EA" stroke="#74C6BA" stroke-width="2"/>
</g>
<text x="615" y="559" text-anchor="middle" class="head">Patient history</text><text x="615" y="583" text-anchor="middle" class="body">Prior health issues and</text><text x="615" y="601" text-anchor="middle" class="body">relevant history</text>
<text x="1015" y="559" text-anchor="middle" class="head">Medication context</text><text x="1015" y="583" text-anchor="middle" class="body">Medication history and</text><text x="1015" y="601" text-anchor="middle" class="body">adherence / missed tablets</text>
<text x="1415" y="559" text-anchor="middle" class="head">Lab context</text><text x="1415" y="583" text-anchor="middle" class="body">Missing labs and previous</text><text x="1415" y="601" text-anchor="middle" class="body">results for comparison</text>
<text x="1815" y="559" text-anchor="middle" class="head">Issue-based grouping</text><text x="1815" y="583" text-anchor="middle" class="body">Organize information around</text><text x="1815" y="601" text-anchor="middle" class="body">health issues / visit needs</text>
<text x="2180" y="559" text-anchor="middle" class="head">Iris AI</text><text x="2180" y="583" text-anchor="middle" class="body">Summary</text><text x="2180" y="601" text-anchor="middle" class="body">context</text>
<path d="M780 571H850 M1180 571H1250 M1580 571H1650 M1980 571H2050" class="ai"/>
<rect x="450" y="655" width="1860" height="65" rx="12" fill="#FFF" stroke="#B9E2DC"/>
<text x="475" y="681" class="notehead">Information layer</text><text x="475" y="702" class="notetext">The concept gathers and organizes available patient information for clinician review. Actual source integrations, data schemas, and technical ingestion mechanisms were not confirmed.</text>

<!-- visit support -->
<rect x="48" y="785" width="2304" height="330" rx="22" fill="#F2F5FB" stroke="#D9E0ED"/>
<rect x="72" y="806" width="390" height="45" rx="12" fill="#E1E8F3"/><text x="267" y="835" text-anchor="middle" class="lane">3 · Visit Assistance &amp; Review</text>
<g filter="url(#shadow)">
<rect x="450" y="880" width="330" height="92" rx="15" fill="#FFF" stroke="#A6B7D3" stroke-width="2"/>
<rect x="850" y="880" width="330" height="92" rx="15" fill="#FFF" stroke="#A6B7D3" stroke-width="2"/>
<rect x="1250" y="880" width="330" height="92" rx="15" fill="#FFF" stroke="#A6B7D3" stroke-width="2"/>
<rect x="1650" y="880" width="330" height="92" rx="15" fill="#FFF" stroke="#A6B7D3" stroke-width="2"/>
<rect x="2050" y="880" width="260" height="92" rx="15" fill="#DCEBFF" stroke="#80A9E5" stroke-width="2"/>
</g>
<text x="615" y="914" text-anchor="middle" class="head">Conversation assistance</text><text x="615" y="938" text-anchor="middle" class="body">Visit dialogue is used in the</text><text x="615" y="956" text-anchor="middle" class="body">concept to aid documentation</text>
<text x="1015" y="914" text-anchor="middle" class="head">Draft suggestions</text><text x="1015" y="938" text-anchor="middle" class="body">Potential medication / test</text><text x="1015" y="956" text-anchor="middle" class="body">entries for review</text>
<text x="1415" y="914" text-anchor="middle" class="head">Clinician controls</text><text x="1415" y="938" text-anchor="middle" class="body">Approve, edit or remove</text><text x="1415" y="956" text-anchor="middle" class="body">drafted entries</text>
<text x="1815" y="914" text-anchor="middle" class="head">Lab comparison &amp; signals</text><text x="1815" y="938" text-anchor="middle" class="body">Compare prior results and</text><text x="1815" y="956" text-anchor="middle" class="body">surface review cues</text>
<text x="2180" y="914" text-anchor="middle" class="head">Reviewed</text><text x="2180" y="938" text-anchor="middle" class="body">EHR / visit</text><text x="2180" y="956" text-anchor="middle" class="body">information</text>
<path d="M780 926H850 M1180 926H1250 M1580 926H1650 M1980 926H2050" class="line"/>
<rect x="450" y="1010" width="1860" height="65" rx="12" fill="#FFF" stroke="#D1D9E7"/>
<text x="475" y="1036" class="notehead">Decision and control layer</text><text x="475" y="1057" class="notetext">AI output is presented as assistance. Clinicians remain responsible for interpreting findings and deciding whether to accept or change suggestions.</text>

<!-- governance / boundaries -->
<rect x="48" y="1140" width="2304" height="350" rx="22" fill="#FFF6E3" stroke="#F0DDAA"/>
<rect x="72" y="1161" width="390" height="45" rx="12" fill="#FFE9B9"/><text x="267" y="1190" text-anchor="middle" class="lane">4 · Product Boundaries &amp; Design Principles</text>
<g filter="url(#shadow)">
<rect x="450" y="1240" width="390" height="110" rx="15" fill="#FFF" stroke="#E1BD59" stroke-width="2"/>
<rect x="895" y="1240" width="390" height="110" rx="15" fill="#FFF" stroke="#E1BD59" stroke-width="2"/>
<rect x="1340" y="1240" width="390" height="110" rx="15" fill="#FFF" stroke="#E1BD59" stroke-width="2"/>
<rect x="1785" y="1240" width="525" height="110" rx="15" fill="#FFE9B9" stroke="#E1BD59" stroke-width="2"/>
</g>
<text x="645" y="1275" text-anchor="middle" class="head">Familiar EHR workflows</text><text x="645" y="1300" text-anchor="middle" class="body">AI assistance fits around</text><text x="645" y="1319" text-anchor="middle" class="body">existing clinician work</text>
<text x="1090" y="1275" text-anchor="middle" class="head">Human-in-the-loop</text><text x="1090" y="1300" text-anchor="middle" class="body">Review and control before</text><text x="1090" y="1319" text-anchor="middle" class="body">suggestions are applied</text>
<text x="1535" y="1275" text-anchor="middle" class="head">Clear information hierarchy</text><text x="1535" y="1300" text-anchor="middle" class="body">Group complex history into</text><text x="1535" y="1319" text-anchor="middle" class="body">digestible review cues</text>
<text x="2047" y="1275" text-anchor="middle" class="head">Not confirmed / intentionally omitted</text><text x="2047" y="1300" text-anchor="middle" class="body">Specific APIs, database, integrations, compliance status,</text><text x="2047" y="1319" text-anchor="middle" class="body">automated diagnoses, or autonomous clinical decisions</text>
<rect x="450" y="1380" width="1860" height="66" rx="12" fill="#FFF" stroke="#E5D7AD"/>
<text x="475" y="1406" class="notehead">Scope note</text><text x="475" y="1428" class="notetext">This is a functional / information architecture reconstructed from project context. It does not claim to represent the actual technical backend, validated clinical protocol, production integrations, or regulatory compliance.</text>
<text x="48" y="1545" class="sub">ONPOINT HEALTH CARE · Portfolio artifact · Reconstructed from available project notes</text>
